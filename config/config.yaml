# Vantara Retail Solutions - Customer Behavior Prediction Platform Configuration
# System & Pipeline Settings

project:
  name: "customer-behavior-prediction"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_dir: "data/raw"
  raw_file: "data/raw/online_retail_II.xlsx"
  raw_zip: "data/raw/online_retail_ii.zip"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  models_artifacts_dir: "models_artifacts"
  logs_dir: "logs"

dataset:
  uci_id: 502
  download_url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
  sheets:
    - "Year 2009-2010"
    - "Year 2010-2011"
  column_mapping:
    "Invoice": "invoice"
    "StockCode": "stock_code"
    "Description": "description"
    "Quantity": "quantity"
    "InvoiceDate": "invoice_date"
    "Price": "price"
    "Customer ID": "customer_id"
    "Country": "country"

data_cleaning:
  drop_missing_customer_id: true
  exclude_admin_stock_codes:
    - "POST"
    - "D"
    - "M"
    - "BANK CHARGES"
    - "PADS"
    - "DOT"
    - "CR"
    - "ADJUST"
    - "ADJUST2"
  outliers:
    quantity_max: 10000
    quantity_min: -10000
    price_max: 5000
    price_min: 0.001

features:
  # Point-in-time cutoff settings for leak-free modeling
  temporal:
    # 90-day churn definition window
    churn_window_days: 90
    # Split date separating observation window from final evaluation window
    # Dataset spans 2009-12-01 to 2011-12-09
    cutoff_date: "2011-09-01"
  weights:
    recency_weight: 0.4
    frequency_weight: 0.3
    monetary_weight: 0.3

modeling:
  train_val_test_split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
  cross_validation_folds: 5
  churn_target_col: "is_churned"
  clv_target_col: "future_clv"

segmentation:
  kmeans_k_range: [2, 10]
  features:
    - "recency"
    - "frequency"
    - "monetary_total"
    - "return_rate"
    - "engagement_score"

api:
  host: "0.0.0.0"
  port: 8000
  reload: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/platform.log"
