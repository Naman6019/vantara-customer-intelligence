version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: vantara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vantara_user
      POSTGRES_PASSWORD: vantara_secure_password
      POSTGRES_DB: vantara_retail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantara_user -d vantara_retail"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend REST API (FastAPI)
  api:
    build: .
    container_name: vantara_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vantara_user:vantara_secure_password@db:5432/vantara_retail
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Frontend Dashboard (Streamlit)
  dashboard:
    build: .
    container_name: vantara_dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  postgres_data:
